    <circle cx="120" cy="212" r="4"/><circle cx="150" cy="236" r="4"/><circle cx="182" cy="222" r="4"/>
    <circle cx="134" cy="268" r="4"/><circle cx="170" cy="282" r="4"/><circle cx="110" cy="296" r="4"/>
    <circle cx="150" cy="306" r="4"/><circle cx="192" cy="296" r="4"/>
  </g>
  <g fill="#fff" opacity="0.55">
    <circle cx="120" cy="212" r="1.4"/><circle cx="150" cy="236" r="1.4"/><circle cx="182" cy="222" r="1.4"/>
    <circle cx="134" cy="268" r="1.4"/><circle cx="170" cy="282" r="1.4"/><circle cx="150" cy="306" r="1.4"/>
  </g>
</svg>
