<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none" role="img" aria-label="Summer dress">
  <defs>
    <linearGradient id="dr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeef3"/>
      <stop offset="1" stop-color="#f8dbe6"/>
    </linearGradient>
    <linearGradient id="dr-cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7bdd0"/>
      <stop offset="1" stop-color="#ec96b5"/>
