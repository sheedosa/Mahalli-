<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none" role="img" aria-label="Leather handbag">
  <defs>
    <linearGradient id="bg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce8ef"/>
      <stop offset="1" stop-color="#f5d3e0"/>
    </linearGradient>
    <linearGradient id="bg-leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef9fbb"/>
      <stop offset="1" stop-color="#df84a4"/>
    </linearGradient>
    <linearGradient id="bg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c87e"/>
      <stop offset="1" stop-color="#cda154"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg-bg)"/>
  <ellipse cx="150" cy="338" rx="80" ry="14" fill="#9a4f6e" opacity="0.08"/>
  <!-- handle -->
  <path d="M108 176 C108 120 192 120 192 176" stroke="url(#bg-gold)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <rect x="86" y="168" width="128" height="160" rx="20" fill="url(#bg-leather)"/>
  <!-- flap -->
  <path d="M86 188 C86 174 96 168 110 168 L190 168 C204 168 214 176 214 190 L214 232 C214 232 150 250 86 232 Z" fill="#e890ad"/>
  <!-- sheen -->
  <rect x="100" y="244" width="16" height="74" rx="8" fill="#ffffff" opacity="0.12"/>
  <!-- gold clasp -->
  <rect x="138" y="222" width="24" height="22" rx="5" fill="url(#bg-gold)"/>
  <rect x="146" y="230" width="8" height="9" rx="2" fill="#a87f3c"/>
</svg>
