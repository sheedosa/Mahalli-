name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Fast, always-required gate. Needs no secrets (public Supabase defaults are
  # baked into src/lib/env.ts).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # Database security + business-logic tests against an isolated local Supabase.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - run: supabase start
      # Schema linter — informational; don't gate CI on pre-existing warnings.
      - run: supabase db lint --level warning || true
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run DB tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:db
      - run: supabase stop || true

  # End-to-end journeys against the built app + local Supabase.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - run: supabase start
      - name: Wire app env to the local Supabase stack
        run: |
          API_URL=$(supabase status -o json | jq -r '.API_URL')
          ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')
          echo "Local Supabase API_URL=$API_URL"
          # Safety: never run E2E (which signs up users + places orders) against
          # anything but the throwaway local stack.
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) : ;;
            *) echo "::error::Refusing to run E2E against non-local Supabase ($API_URL)"; exit 1 ;;
          esac
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - run: supabase stop || true
